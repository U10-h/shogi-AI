name: Import preserved shogi history
on:
  push:
    branches: [main]
    paths: [docs/history/import-request.json]
permissions:
  contents: write
concurrency:
  group: import-preserved-shogi-history
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify the preserved Git bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          manifest = json.loads(pathlib.Path('docs/history/import-request.json').read_text())
          assert os.environ['GITHUB_REPOSITORY'] == 'U10-h/shogi-AI'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'shogi-history.bundle'
          with target.open('wb') as output:
              for part in manifest['parts']:
                  request = urllib.request.Request(
                      'https://api.github.com/repos/U10-h/shogi-AI/git/blobs/' + part['git_blob_sha'],
                      headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                               'Accept': 'application/vnd.github+json',
                               'X-GitHub-Api-Version': '2022-11-28'})
                  with urllib.request.urlopen(request, timeout=90) as response:
                      result = json.load(response)
                  data = base64.b64decode(result['content'])
                  assert len(data) == part['size_bytes']
                  assert hashlib.sha256(data).hexdigest() == part['sha256']
                  output.write(data)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == manifest['bundle_sha256']
          print('Verified complete Git bundle:', target.stat().st_size, 'bytes')
          PY
          git bundle verify "$RUNNER_TEMP/shogi-history.bundle"
      - name: Preserve source commits and publish both branches without force
        run: |
          git fetch "$RUNNER_TEMP/shogi-history.bundle" \
            refs/heads/main:refs/remotes/history/main \
            refs/heads/work/v0.15-checkpoint-20260922:refs/remotes/history/work
          test "$(git rev-parse refs/remotes/history/main)" = a8798c2609bfad6fe5cdb807e9ff3465de9f7692
          test "$(git rev-parse refs/remotes/history/work)" = 6f8540e2b937fc93280d405b0348e4cf5d5020b4
          git config user.name Codex
          git config user.email codex@openai.com
          git merge --no-ff --allow-unrelated-histories refs/remotes/history/main \
            -m "Import chronological shogi development and experiment history with original commits"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          start = text.index('送信先は `U10-h/shogi-AI`。')
          end = text.index('\n', start)
          text = text[:start] + '保存先は [U10-h/shogi-AI](https://github.com/U10-h/shogi-AI)。完成済みv0.14までを `main`、取得時点のv0.15を `work/v0.15-checkpoint-20260922` に分けて保存しています。元のコミットのハッシュと親子関係も保持しています。' + text[end:]
          p.write_text(text)
          report = Path('docs/history/github-import-20260922.md')
          with report.open('a') as output:
              output.write('\n## GitHub反映の完了\n\n認証済みGitHub接続と一回限りのActionsで履歴を取り込み、元のコミットのハッシュと親子関係を維持して保存した。初期の接続失敗は解消済み。`main` はv0.14まで、`work/v0.15-checkpoint-20260922` は取得時点のv0.15を保持する。強制pushは使用していない。取込み用の書き込み権限付きワークフローは処理後に削除し、既存の検証ワークフローだけを残した。\n')
          Path('.github/workflows/import-history.yml').unlink()
          PY
          git add README.md docs/history/github-import-20260922.md .github/workflows/import-history.yml
          git commit -m "Record completed GitHub migration and remove the one-time importer"
          git push --atomic origin HEAD:refs/heads/main \
            refs/remotes/history/work:refs/heads/work/v0.15-checkpoint-20260922
